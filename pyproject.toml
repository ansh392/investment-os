[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "investment-os"
version = "1.0.0"
description = "Auditable institutional-style investment research, valuation, signal testing, and private-market underwriting platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "requests>=2.32",
  "pandas>=2.2",
  "numpy>=2.0",
  "python-dotenv>=1.0",
  "streamlit>=1.50",
  "plotly>=5.24",
  "yfinance>=0.2.54",
  "anthropic>=2.6"
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7"]

[tool.setuptools.packages.find]
include = ["investment_os*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
